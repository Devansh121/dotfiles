[colors]
background = #1a1b26
background-alt = #16161e
foreground = #c0caf5
muted = #565f89
accent = #7aa2f7
red = #f7768e
green = #9ece6a
yellow = #e0af68
purple = #bb9af7
cyan = #7dcfff

[bar/main]
width = 100%
height = 32
radius = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;2
font-2 = Noto Sans:size=10;2
font-3 = Noto Color Emoji:scale=10;2

modules-left = i3
modules-center = xwindow
modules-right = cpu memory temperature filesystem pulseaudio date tray

tray-position = right
tray-padding = 6
tray-background = ${colors.background}

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = false
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
format = <label-state>

label-focused = %index%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.background}
label-focused-padding = 2
label-focused-font = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.muted}
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
format = <label>
label = %title:0:80:...%
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label =  %percentage:2%%
label-foreground = ${colors.purple}

[module/memory]
type = internal/memory
interval = 2
format = <label>
label =  %gb_used%
label-foreground = ${colors.cyan}

[module/temperature]
type = internal/temperature
interval = 2
thermal-zone = 0
warn-temperature = 80
format = <ramp><label>
format-warn = <ramp><label-warn>
label =  %temperature-c%
label-warn =  %temperature-c%
label-foreground = ${colors.yellow}
label-warn-foreground = ${colors.red}
ramp-0 = ""
ramp-foreground = ${colors.yellow}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted = <label-mounted>
label-mounted =  %percentage_used%%
label-mounted-foreground = ${colors.green}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume =  %percentage%%
label-volume-foreground = ${colors.foreground}
label-muted =  muted
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/date]
type = internal/date
interval = 1
date = %a %d
time = %H:%M
label = %date% · %time%
label-foreground = ${colors.accent}

[module/tray]
type = internal/tray
format-margin = 8
tray-spacing = 8

[settings]
screenchange-reload = true
pseudo-transparency = false
