# --- Mouse mode ---
set -g mouse on                 # Enable mouse support (scroll, resize, select panes/windows)

# --- General convenience ---
set -g history-limit 10000      # Bigger scrollback buffer
#set -g base-index 1             # Start windows at 1
#setw -g pane-base-index 1       # Start panes at 1

# --- Extra navigation shortcuts (in addition to defaults) ---
# Pane navigation with Vim keys (no unbind needed, default arrow keys still work)
#bind h select-pane -L
#bind j select-pane -D
#bind k select-pane -U
#bind l select-pane -R

# Resize panes with Ctrl + Vim keys (default Ctrl-b + arrows still work)
#bind -r C-h resize-pane -L 2
#bind -r C-l resize-pane -R 2
#bind -r C-j resize-pane -D 1
#bind -r C-k resize-pane -U 1

# --- Extra split shortcuts (keep defaults too) ---
#bind | split-window -h          # Vertical split with |
#bind - split-window -v          # Horizontal split with -

# --- Status bar tweaks ---
set -g status-bg black
set -g status-fg white
set -g status-left "#[bold]#S "
set -g status-right "#[fg=green]%Y-%m-%d #[fg=yellow]%H:%M #[fg=cyan]#(whoami)@#h"
setw -g window-status-current-format "#[fg=black,bg=yellow] #I:#W "

# --- Quality of life ---
#set -sg escape-time 0            # Make Esc more responsive (good for Vim)
#setw -g mode-keys vi             # Vi-style copy/scroll mode
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf!"

# --- Prefix ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Crash-survivable session persistence --- rebuilt 2026-08-07
# Saves fire on real events, never a timer: tmux layout hooks below, plus a
# bash PROMPT_COMMAND (see ~/.bashrc) so every command -- including cd --
# keeps the snapshot current. A crash therefore loses nothing.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Single source of truth for the state path (absolute, so hooks can't miss it)
set -g @resurrect-dir '/home/devansh/.local/share/tmux/resurrect'

# Off deliberately: full scrollback capture replayed stale text into panes and
# archived anything that scrolled past as plaintext. The last-commands sidecar
# gives us the useful part instead.
set -g @resurrect-capture-pane-contents 'off'

# Keep the 20 newest snapshots after each save
set -g @resurrect-hook-post-save-all 'ls -t /home/devansh/.local/share/tmux/resurrect/tmux_resurrect_*.txt | tail -n +21 | xargs -r rm --'

# New session: restore once per boot, then save. ONE hook doing both, because
# two hooks here run concurrently (-b) and the save would race the restore --
# saving the empty new session over the good snapshot.
set-hook -g after-new-session    'run-shell -b /home/devansh/.local/bin/tmux-rs-boot-restore.sh'

# Layout-change saves. All go through the guarded wrapper, which no-ops while a
# restore is rebuilding windows.
# Deliberately NOT hooked: session-closed / pane-exited. Those fire during
# teardown and would persist a half-dismantled session.
set-hook -g after-new-window     'run-shell -b /home/devansh/.local/bin/tmux-rs-save.sh'
set-hook -g after-split-window   'run-shell -b /home/devansh/.local/bin/tmux-rs-save.sh'
set-hook -g after-rename-window  'run-shell -b /home/devansh/.local/bin/tmux-rs-save.sh'
set-hook -g after-kill-pane      'run-shell -b /home/devansh/.local/bin/tmux-rs-save.sh'
set-hook -g client-detached      'run-shell -b /home/devansh/.local/bin/tmux-rs-save.sh'

# prefix + Shift-X  ->  forget all saved state (live session untouched).
# Clears snapshots, the boot marker, and the last-commands sidecar together.
bind X run-shell 'rm -rf /home/devansh/.local/share/tmux/resurrect' \; display "resurrect state cleared"

# Must be the very last line
run '~/.tmux/plugins/tpm/tpm'
